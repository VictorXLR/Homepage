<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seascape Shader</title>
  <style>
    * { box-sizing: border-box; }
    html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    canvas { display: block; background: #07121e; }
    .controls {
      position: fixed; top: 1rem; right: 1rem; width: min(18rem, calc(100vw - 2rem));
      padding: 1rem; color: #eaf7ff; background: #08131dd9; border: 1px solid #89c7df66;
      border-radius: .6rem; backdrop-filter: blur(12px); font: 12px/1.35 system-ui, sans-serif;
    }
    .controls h1 { margin: 0 0 .8rem; font-size: .9rem; letter-spacing: .08em; text-transform: uppercase; }
    .control { display: grid; grid-template-columns: 1fr 3.4rem; gap: .5rem; align-items: center; margin: .55rem 0; }
    .control label { grid-column: 1 / -1; color: #b6d2df; }
    .control input { width: 100%; accent-color: #69d5ff; }
    .control output { text-align: right; font-variant-numeric: tabular-nums; color: #fff; }
    .controls button { width: 100%; margin-top: .55rem; padding: .45rem .6rem; color: #eaf7ff; background: #17455a; border: 1px solid #5eb4d4; border-radius: .3rem; cursor: pointer; }
    .controls button:hover { background: #22637e; }
    @media (max-width: 520px) { .controls { top: auto; bottom: 1rem; max-height: 55vh; overflow: auto; } }
    .notice {
      position: fixed; inset: auto 1rem 1rem; padding: .7rem .9rem;
      color: #fff; background: #1d2630e6; border-radius: .4rem;
      font: 14px/1.4 system-ui, sans-serif; display: none;
    }
    .notice.visible { display: block; }
  </style>
</head>
<body>
  <canvas id="seascape" aria-label="Animated seascape shader"></canvas>
  <aside class="controls" aria-label="Seascape controls">
    <h1>Seascape Controls</h1>
    <div class="control"><label for="wave-height">Wave height</label><input id="wave-height" data-setting="waveHeight" type="range" min="0.05" max="2" step="0.01" value="0.6"><output></output></div>
    <div class="control"><label for="choppiness">Choppiness</label><input id="choppiness" data-setting="choppiness" type="range" min="0.1" max="8" step="0.1" value="4"><output></output></div>
    <div class="control"><label for="wave-speed">Wave speed</label><input id="wave-speed" data-setting="waveSpeed" type="range" min="0" max="3" step="0.01" value="0.8"><output></output></div>
    <div class="control"><label for="wave-frequency">Wave frequency</label><input id="wave-frequency" data-setting="waveFrequency" type="range" min="0.02" max="0.6" step="0.01" value="0.16"><output></output></div>
    <div class="control"><label for="camera-height">Camera height</label><input id="camera-height" data-setting="cameraHeight" type="range" min="0.5" max="8" step="0.1" value="3.5"><output></output></div>
    <div class="control"><label for="time-scale">Time scale</label><input id="time-scale" data-setting="timeScale" type="range" min="0" max="2" step="0.01" value="0.3"><output></output></div>
    <button id="reset-controls" type="button">Reset values</button>
  </aside>
  <div id="notice" class="notice" role="alert"></div>

  <script id="vertex-shader" type="x-shader/x-vertex">
    attribute vec2 aPosition;
    void main() { gl_Position = vec4(aPosition, 0.0, 1.0); }
  </script>
  <script id="fragment-shader" type="x-shader/x-fragment">
    /* "Seascape" by Alexander Alekseev aka TDM - 2014. CC BY-NC-SA 3.0. */
    precision highp float;
    uniform vec2 iResolution; uniform float iTime; uniform vec2 iMouse;
    uniform float uWaveHeight; uniform float uChoppiness; uniform float uWaveSpeed;
    uniform float uWaveFrequency; uniform float uCameraHeight; uniform float uTimeScale;
    const int NUM_STEPS = 32; const float PI = 3.141592; const float EPSILON = 1e-3;
    #define EPSILON_NRM (0.1 / iResolution.x)
    const int ITER_GEOMETRY = 3; const int ITER_FRAGMENT = 5; const float SEA_HEIGHT = 0.6;
    const vec3 SEA_BASE = vec3(0.0, 0.09, 0.18); const vec3 SEA_WATER_COLOR = vec3(0.8, 0.9, 0.6) * 0.6;
    #define SEA_TIME (1.0 + iTime * uWaveSpeed)
    const mat2 octave_m = mat2(1.6, 1.2, -1.2, 1.6);
    mat3 fromEuler(vec3 ang) { vec2 a1=vec2(sin(ang.x),cos(ang.x)),a2=vec2(sin(ang.y),cos(ang.y)),a3=vec2(sin(ang.z),cos(ang.z)); mat3 m; m[0]=vec3(a1.y*a3.y+a1.x*a2.x*a3.x,a1.y*a2.x*a3.x+a3.y*a1.x,-a2.y*a3.x); m[1]=vec3(-a2.y*a1.x,a1.y*a2.y,a2.x); m[2]=vec3(a3.y*a1.x*a2.x+a1.y*a3.x,a1.x*a3.x-a1.y*a3.y*a2.x,a2.y*a3.y); return m; }
    float hash(vec2 p) { return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
    float noise(vec2 p) { vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f); return -1.0+2.0*mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y); }
    float diffuse(vec3 n,vec3 l,float p) { return pow(dot(n,l)*.4+.6,p); }
    float specular(vec3 n,vec3 l,vec3 e,float s) { return pow(max(dot(reflect(e,n),l),0.),s)*(s+8.)/(PI*8.); }
    vec3 getSkyColor(vec3 e) { e.y=(max(e.y,0.)*.8+.2)*.8; return vec3(pow(1.-e.y,2.),1.-e.y,.6+(1.-e.y)*.4)*1.1; }
    float sea_octave(vec2 uv,float choppy) { uv+=noise(uv); vec2 wv=1.-abs(sin(uv)),swv=abs(cos(uv)); wv=mix(wv,swv,wv); return pow(1.-pow(wv.x*wv.y,.65),choppy); }
    float mapInternal(vec3 p,int iterations) { float freq=uWaveFrequency,amp=uWaveHeight,choppy=uChoppiness; vec2 uv=p.xz; uv.x*=.75; float h=0.; for(int i=0;i<ITER_FRAGMENT;i++) { if(i>=iterations) break; float d=sea_octave((uv+SEA_TIME)*freq,choppy)+sea_octave((uv-SEA_TIME)*freq,choppy); h+=d*amp; uv*=octave_m; freq*=1.9; amp*=.22; choppy=mix(choppy,1.,.2); } return p.y-h; }
    float map(vec3 p) { return mapInternal(p,ITER_GEOMETRY); } float map_detailed(vec3 p) { return mapInternal(p,ITER_FRAGMENT); }
    vec3 getSeaColor(vec3 p,vec3 n,vec3 l,vec3 eye,vec3 dist) { float fresnel=min(pow(clamp(1.-dot(n,-eye),0.,1.),3.),.5); vec3 color=mix(SEA_BASE+diffuse(n,l,80.)*SEA_WATER_COLOR*.12,getSkyColor(reflect(eye,n)),fresnel); color+=SEA_WATER_COLOR*(p.y-SEA_HEIGHT)*.18*max(1.-dot(dist,dist)*.001,0.); return color+specular(n,l,eye,600.*inversesqrt(dot(dist,dist))); }
    vec3 getNormal(vec3 p,float eps) { vec3 n; n.y=map_detailed(p); n.x=map_detailed(vec3(p.x+eps,p.y,p.z))-n.y; n.z=map_detailed(vec3(p.x,p.y,p.z+eps))-n.y; n.y=eps; return normalize(n); }
    float heightMapTracing(vec3 ori,vec3 dir,out vec3 p) { float tm=0.,tx=1000.,hx=map(ori+dir*tx); if(hx>0.) {p=ori+dir*tx;return tx;} float hm=map(ori); for(int i=0;i<NUM_STEPS;i++) { float tmid=mix(tm,tx,hm/(hm-hx)); p=ori+dir*tmid; float hmid=map(p); if(hmid<0.) {tx=tmid;hx=hmid;} else {tm=tmid;hm=hmid;} if(abs(hmid)<EPSILON) break;} return mix(tm,tx,hm/(hm-hx)); }
    vec3 getPixel(vec2 coord,float time) { vec2 uv=coord/iResolution.xy*2.-1.; uv.x*=iResolution.x/iResolution.y; vec3 ang=vec3(sin(time*3.)*.1,sin(time)*.2+.3,time),ori=vec3(0.,uCameraHeight,time*5.); vec3 dir=normalize(vec3(uv,-2.)); dir.z+=length(uv)*.14; dir=normalize(dir)*fromEuler(ang); vec3 p; heightMapTracing(ori,dir,p); vec3 dist=p-ori,n=getNormal(p,dot(dist,dist)*EPSILON_NRM),light=normalize(vec3(0.,1.,.8)); return mix(getSkyColor(dir),getSeaColor(p,n,light,dir,dist),pow(smoothstep(0.,-.02,dir.y),.2)); }
    void main() { float time=iTime*uTimeScale+iMouse.x*.01; gl_FragColor=vec4(pow(getPixel(gl_FragCoord.xy,time),vec3(.65)),1.); }
  </script>
  <script>
    (() => { const canvas=document.querySelector('#seascape'),notice=document.querySelector('#notice'),gl=canvas.getContext('webgl',{antialias:false}); const showError=m=>{notice.textContent=m;notice.classList.add('visible')}; if(!gl){showError('WebGL is not available in this browser.');return;} const compile=(type,source)=>{const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(shader));return shader;}; try { const program=gl.createProgram(); gl.attachShader(program,compile(gl.VERTEX_SHADER,document.querySelector('#vertex-shader').textContent));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,document.querySelector('#fragment-shader').textContent));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const position=gl.getAttribLocation(program,'aPosition'),resolution=gl.getUniformLocation(program,'iResolution'),time=gl.getUniformLocation(program,'iTime'),mouse=gl.getUniformLocation(program,'iMouse'),names=['waveHeight','choppiness','waveSpeed','waveFrequency','cameraHeight','timeScale'],uniforms=Object.fromEntries(names.map(n=>[n,gl.getUniformLocation(program,`u${n[0].toUpperCase()}${n.slice(1)}`)])),inputs=[...document.querySelectorAll('[data-setting]')],defaults=Object.fromEntries(inputs.map(i=>[i.dataset.setting,Number(i.value)])),settings={...defaults};const sync=i=>{settings[i.dataset.setting]=Number(i.value);i.nextElementSibling.value=settings[i.dataset.setting].toFixed(i.step.includes('.')?i.step.split('.')[1].length:0)};inputs.forEach(i=>{i.addEventListener('input',()=>sync(i));sync(i)});document.querySelector('#reset-controls').addEventListener('click',()=>inputs.forEach(i=>{i.value=defaults[i.dataset.setting];sync(i)}));let mouseX=0,start=performance.now();canvas.addEventListener('pointermove',e=>mouseX=e.clientX);canvas.addEventListener('pointerdown',e=>mouseX=e.clientX);const draw=now=>{const dpr=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}gl.useProgram(program);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.enableVertexAttribArray(position);gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);gl.uniform2f(resolution,w,h);gl.uniform1f(time,(now-start)/1000);gl.uniform2f(mouse,mouseX,0);names.forEach(n=>gl.uniform1f(uniforms[n],settings[n]));gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(draw)};requestAnimationFrame(draw);}catch(error){console.error(error);showError(`Shader setup failed: ${error.message}`)}})();
  </script>
</body>
</html>
